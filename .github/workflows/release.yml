# 整个流程的名字
name: Release
# 触发时机，在 tag 被 push 操作触发
on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write # Required for OIDC
  contents: read

# 任务，定义个changelog 的任务
jobs:
  changelog:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # 设置 Node
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # 设置 pnpm
      - name: Setup PNPM
        uses: pnpm/action-setup@v6
        with:
          version: 10

      # 获取 tag 的版本类型（仅支持 正式版、alpha和beta版）
      - name: Determine release tag
        id: determine_tag
        run: |
          TAG=$(echo "${GITHUB_REF}" | sed 's/refs\/tags\/\(.*\)/\1/')
          if [[ "$TAG" =~ -alpha ]]; then
            echo "tag=alpha" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" =~ -beta ]]; then
            echo "tag=beta" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          else
            echo "Unsupported version detected. Terminating."
            exit 1
          fi

      - name: Publish npm eslint configs
        working-directory: ./configs
        run: |
          pnpm install
          npm publish --tag ${{ steps.determine_tag.outputs.tag }} --access public

      ## 创建 Release.txt 文件，内容为当前提交的 SHA 值
      - name: Build Release.txt
        run: echo ${{ github.sha }} > Release.txt
      - name: Test
        run: cat Release.txt
      # 打包 dist 为自定义压缩包
      - name: Create release archive
        run: |
          PKG_NAME=$(node -p "require('./package.json').name.replace('@skax/', '')")
          VERSION=$(node -p "require('./package.json').version")
          ARCHIVE_NAME="${PKG_NAME}-${VERSION}"

          # 创建包含 src 和 package.json 的 zip 包
          zip -r "${ARCHIVE_NAME}.zip" src package.json

          # 创建包含 src 和 package.json 的 tar.gz 包
          tar -czf "${ARCHIVE_NAME}.tar.gz" src package.json

          echo "archive_name=${ARCHIVE_NAME}" >> "$GITHUB_OUTPUT"
        id: archive

      # 自动创建 GitHub Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ steps.determine_tag.outputs.tag != 'latest' }}
          files: |
            ${{ steps.archive.outputs.archive_name }}.zip
            ${{ steps.archive.outputs.archive_name }}.tar.gz
            Release.txt
